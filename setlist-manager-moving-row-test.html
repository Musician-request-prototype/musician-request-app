 row.addEventListener('touchend',finish,{passive:true});row.addEventListener('touchcancel',finish,{passive:true});
}
function attachWholeRowDrag(row,index,deleteButton){
 installTouchDrag(row,()=>({type:'set',index}));
 // Desktop pointer drag without a separate grip.
 row.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'||e.target.closest('button,input,select')||e.button!==0)return;beginDrag(e,row,index)});
}
function attachLibraryRowDrag(row,song,addButton){
 installTouchDrag(row,()=>active()&&!active().songIds.includes(String(song.id))?({type:'library',song}):null);
 row.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'||e.target.closest('button,input,select')||e.button!==0)return;beginLibraryDrag(e,song,row)});
}

// Reposition the menu every time it opens, including split-screen widths.
function positionManagerMenu(){
 const details=$('manage-details'), menu=details.querySelector('.menu-content');
 if(!details.open)return;
 const button=details.querySelector('summary').getBoundingClientRect();
 const vw=document.documentElement.clientWidth, vh=window.innerHeight;
 const width=Math.min(390,vw-24);
 const left=Math.max(12,Math.min(vw-width-12,button.right-width));
 const below=vh-button.bottom-12, above=button.top-12;
 const showAbove=below<190&&above>below;
 const top=showAbove?12:Math.min(button.bottom+8,vh-110);
 const height=Math.max(100,showAbove?above:vh-top-12);
 menu.style.setProperty('--menu-left',left+'px');
 menu.style.setProperty('--menu-top',top+'px');
 menu.style.setProperty('--menu-height',height+'px');
}
$('manage-details').addEventListener('toggle',positionManagerMenu);
window.addEventListener('resize',positionManagerMenu);
$('setlist-picker').onchange=e=>pick(e.target.value||null);
$('save-setlist').onclick=()=>{if(active())save()};
$('add-break').onclick=()=>{
 const s=active();if(!s||s.songIds.length<1)return;
 const last=s.breaks.at(-1)||0;
 // Insert the new divider ahead of the final song; user can drag it to the desired boundary.
 const position=Math.max(last+1,s.songIds.length-1);
  if(position>s.songIds.length){msg('Add another song before inserting another set break.');return}
 s.breaks=normalizedBreaks({breaks:[...s.breaks,position]},s.songIds.length);
 save();drawSelected();$('manage-details').open=false;
};
$('exit-manager').onclick=()=>{location.href='performance-development.html'};
$('new-setlist').onclick=()=>{$('manage-details').open=true;$('new-name').focus()};
$('play-setlist').onclick=()=>{const s=active();if(!s||!s.songIds.length)return;location.href='performance-development.html?setlist='+encodeURIComponent(s.id)};
const FONT_KEY='setlist-app-font-v1';const SIZE_KEY='setlist-studio-text-scale-v1';
let textScale=Math.max(0.85,Math.min(1.75,Number(localStorage.getItem(SIZE_KEY))||1.30));
function applyTextScale(){document.documentElement.style.setProperty('--text-scale',textScale.toFixed(2));$('text-scale-label').textContent=Math.round(textScale*100)+'%';localStorage.setItem(SIZE_KEY,String(textScale))}
$('text-smaller').onclick=()=>{textScale=Math.max(0.85,Math.round((textScale-.1)*100)/100);applyTextScale()};
$('text-larger').onclick=()=>{textScale=Math.min(1.75,Math.round((textScale+.1)*100)/100);applyTextScale()};
applyTextScale();
function setAppFont(value){document.body.dataset.font=['hand','modern','classic'].includes(value)?value:'hand';$('font-choice').value=document.body.dataset.font;localStorage.setItem(FONT_KEY,document.body.dataset.font)}
setAppFont(localStorage.getItem(FONT_KEY)||'hand');$('font-choice').onchange=e=>setAppFont(e.target.value);
$('create').onclick=()=>{if(!musicianId){msg('Load your songbook first.');return}const name=$('new-name').value.trim();if(!name){msg('Enter a setlist name first.');return}const s={id:makeId(),name,songIds:[],breaks:[]};sets.push(s);$('new-name').value='';$('manage-details').open=false;save();pick(s.id)};
$('new-name').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('create').click()}});
$('rename').onclick=()=>{const s=active();if(!s)return;const n=prompt('Rename setlist:',s.name);if(n===null)return;if(!n.trim())return msg('Setlist name cannot be empty.');s.name=n.trim().slice(0,100);save();render()};
$('duplicate').onclick=()=>{const s=active();if(!s)return;const clone={id:makeId(),name:s.name+' (Copy)',songIds:[...s.songIds],breaks:[...s.breaks]};sets.push(clone);save();pick(clone.id)};
$('remove-setlist').onclick=()=>{const s=active();if(!s||!confirm('Delete setlist "'+s.name+'"? Your songs will not be deleted.'))return;sets=sets.filter(x=>x.id!==s.id);selectedId=sets[0]?.id||null;save();render()};
$('export').onclick=()=>{if(!musicianId)return msg('Load your library first.');const text=JSON.stringify({type:'musician-setlists-backup',version:1,exportedAt:new Date().toISOString(),setlists:sets.map(s=>({...s}))},null,2);const blob=new Blob([text],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='setlists-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)};
$('song-search').oninput=()=>{drawLibrary();$('library-songs').scrollTop=0};$('song-filter').onchange=()=>{drawLibrary();$('library-songs').scrollTop=0};$('reload').onclick=()=>init(true);
async function init(force=false){msg('Loading song library…');let cache=null;try{cache=await readSavedSongs()}catch(e){console.warn('No offline library:',e)}if(cache?.songs?.length){userId=cache.userId;musicianId=cache.musicianId;songs=cache.songs;loadSets();selectedId=sets[0]?.id||null;render();msg('Loaded '+songs.length+' saved songs · Setlists save locally on this device.')}if(!navigator.onLine){if(!songs.length)msg('Offline library not found. Open Performance Beta while online and save your song library.');return}try{if(!window.supabase?.createClient){if(!songs.length)msg('Cannot connect to Supabase right now; try reloading online.');return}dbClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const {data:auth,error:authError}=await dbClient.auth.getSession();if(authError)throw authError;const user=auth?.session?.user;if(!user){if(!songs.length)msg('Please sign in through Musician Login, then reopen Setlist Manager.');return}const {data:m,error:err}=await dbClient.from('musicians').select('id').eq('user_id',user.id).maybeSingle();if(err||!m)throw err||new Error('Musician account not found');if(musicianId&&musicianId!==m.id){sets=[];selectedId=null}const loaded=[];for(let offset=0;offset<20000;offset+=500){const {data,error}=await dbClient.from('songs').select('id,title,artist,song_status').eq('musician_id',m.id).order('title').order('id').range(offset,offset+499);if(error)throw error;loaded.push(...(data||[]));if(!data||data.length<500)break}if(loaded.length){songs=loaded;musicianId=m.id;userId=user.id;loadSets();selectedId=sets.find(s=>s.id===selectedId)?.id||sets[0]?.id||null;render();msg('Synced '+songs.length+' songs online · Setlists save locally (not yet in Supabase).')}}catch(e){msg((songs.length?'Using saved song library. ':'')+'Online sync unavailable: '+(e.message||e))}}
if('serviceWorker' in navigator){navigator.serviceWorker.register('./performance-offline-sw.js').catch(e=>console.warn('Offline page cache unavailable',e));}
init();
</script></body></html>
