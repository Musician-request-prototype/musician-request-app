
<!doctype html><html><head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Phil Smith Live — Show Controls Fix Test</title><style>body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:20px}.box{max-width:760px;margin:auto}.card{background:#111;border:1px solid #444;border-radius:16px;padding:16px;margin:12px 0}button,input{font-size:16px;padding:12px;border-radius:10px;border:1px solid #555;background:#fff;color:#000}button{font-weight:800}.row{display:flex;gap:8px;flex-wrap:wrap}.danger{background:#222;color:#fff}.small{color:#aaa;font-size:13px}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #333;padding:9px;text-align:left}@media(max-width:600px){body{padding:10px}table{font-size:13px}button{padding:10px}}</style></head><body><div class="box"><h1>Phil Smith Live — Show Controls</h1><div class="card"><label>Admin PIN</label><br><input id="pin" type="password" placeholder="Enter PIN"><div class="row" style="margin-top:10px"><button onclick="load()">Unlock / Refresh</button><button onclick="startShow()">Start New Show</button><button class="danger" onclick="endShow()">End Show</button><button onclick="reopen()">Reopen Current Show</button></div><p id="status" class="small">Enter your PIN to begin.</p><p id="autoStatus" class="small">Auto-refresh starts after you unlock.</p><p class="small"><strong>Start New Show</strong> starts fresh request/played counts while keeping all previous shows in your Google Sheet.</p></div><div class="card"><h2>Current show requests</h2><div id="data" class="small">Unlock to load.</div></div></div><script>
  const API_URL="https://script.google.com/macros/s/AKfycbwCVYb78lADt8BH_FoNuqQYM-5RpWSB0UT2L2AQBE2NCU3nCzNQFMDl4RWwk542SCkr/exec";
async function api(action,p={}){try{const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action,...p,pin:document.getElementById('pin').value})});return await r.json()}catch(e){return {ok:false,message:'Could not reach request service.'}}}
const SUPABASE_URL = "https://sluffhedekxnoasndnid.supabase.co";
const SUPABASE_KEY = "sb_publishable_frGKYqeqHpuww4Y78uvSVQ_SAMLLDk8";
const MUSICIAN_ID = "adbce7b8-424e-4de3-84ed-7c4e68c64559";
  
 const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); 
  
  let unlocked=false;let refreshBusy=false;
async function load(auto=false){if(refreshBusy)return;refreshBusy=true;const r=await api('adminStatus');refreshBusy=false;if(!r.ok){if(!auto)document.getElementById("status").textContent=r.message||'Not authorized';return}unlocked=true;document.getElementById("autoStatus").textContent='Auto-refresh ON • checking every 10 seconds';document.getElementById("status").textContent=(r.open?'Requests are OPEN':'Requests are CLOSED')+(r.showLabel?' • '+r.showLabel:'');let h='<table><tr><th>Song / Requester</th><th>Requests</th><th>Played</th><th>Tip</th></tr>';(r.rows||[]).forEach(x=>{const who=x.name?`<br><span class="small"><strong>Name:</strong> ${esc(x.name)}</span>`:'';const note=x.notes?`<br><span class="small"><strong>Notes:</strong> ${esc(x.notes)}</span>`:'';h+=`<tr><td>${esc(x.song)}<br><span class="small">${esc(x.artist)}</span>${who}${note}</td><td>${x.count}</td><td><button onclick="played('${encodeURIComponent(x.key)}')">${x.played?'PLAYED':'Mark played'}</button></td><td>${esc(x.tip||'')}</td></tr>`});document.getElementById("data").innerHTML=(r.rows&&r.rows.length)?h+'</table>':'No requests yet for this show.'}
async function startShow(){if(!confirm('Start a NEW show? Tonight’s request counts and played status will start fresh. Previous history will stay in Google Sheets.'))return;const r=await api('startShow');if(!r.ok)alert(r.message||'Error');await load()}
async function endShow(){const r=await api('endShow');if(!r.ok)alert(r.message||'Error');await load()}
async function reopen(){const r=await api('setOpen',{open:true});if(!r.ok)alert(r.message||'Error');await load()}
async function played(k){const r=await api('played',{key:decodeURIComponent(k)});if(r.ok)load();else alert(r.message||'Error')}
setInterval(()=>{if(unlocked&&document.visibilityState==='visible')load(true)},10000);
document.addEventListener('visibilitychange',()=>{if(unlocked&&document.visibilityState==='visible')load(true)});
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
</script></body></html>
