<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Phil Smith Live — Song Requests</title>
<style>
:root{--bg:#000;--fg:#fff;--muted:#bdbdbd;--line:#333;--panel:#111;--accent:#fff;--disabled:#555}
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.wrap{max-width:900px;margin:auto;padding:20px 14px 50px}.hero{text-align:center}.logo{width:min(100%,700px);height:auto;display:block;margin:0 auto 2px}.tagline{font-size:18px;font-weight:650;margin:0 0 18px}.status{display:inline-flex;align-items:center;gap:7px;border:1px solid #444;border-radius:999px;padding:7px 12px;color:#fff;font-size:13px;margin-bottom:14px}.dot{width:8px;height:8px;border-radius:50%;background:#fff}.off .dot{background:#777}.controls{position:static;background:#000;padding:10px 0}.search{width:100%;background:#111;color:#fff;border:1px solid #555;border-radius:12px;padding:15px;font-size:18px;outline:none}.filters{display:flex;gap:8px;margin-top:9px;overflow:auto;padding-bottom:2px}.filter{flex:0 0 auto;background:#111;color:#fff;border:1px solid #555;border-radius:999px;padding:9px 13px;font-size:14px}.filter.active{background:#fff;color:#000;border-color:#fff}.count{color:#aaa;font-size:13px;margin:12px 2px}.list{display:grid;gap:10px}.song{border:1px solid #333;background:#0d0d0d;border-radius:14px;padding:14px;display:flex;gap:14px;align-items:center}.info{flex:1;min-width:0}.title{font-size:20px;font-weight:750;line-height:1.18}.artist{font-size:17px;color:#ddd;margin-top:4px}.decade{font-size:12px;color:#aaa;margin-top:5px}.req{background:#fff;color:#000;border:0;border-radius:11px;padding:12px 14px;font-weight:800;font-size:14px;min-width:100px}.req:disabled{background:#333;color:#aaa}.badge{display:inline-block;border:1px solid #555;border-radius:999px;padding:4px 7px;margin-top:7px;font-size:11px;color:#ddd}.modal{display:none;position:fixed;inset:0;background:#000c;z-index:20;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{width:100%;max-width:900px;background:#111;border-top:1px solid #444;border-radius:22px 22px 0 0;padding:20px 16px 30px}.sheet h2{margin:0 0 5px;font-size:24px}.selected{color:#ccc;margin-bottom:15px}.sheet input,.sheet textarea{width:100%;background:#000;color:#fff;border:1px solid #555;border-radius:11px;padding:12px;font-size:16px}.sheet textarea{min-height:80px;resize:vertical;font-family:inherit}.sheet label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}.actions{display:flex;gap:9px;margin-top:16px}.btn{border:0;border-radius:11px;padding:13px;font-weight:800;font-size:15px}.primary{background:#fff;color:#000;flex:1}.secondary{background:#222;color:#fff;border:1px solid #555}.success{text-align:center;display:none}.tipbox{border:1px solid #444;background:#080808;border-radius:16px;padding:16px;margin-top:16px}.tips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.tip{background:#fff;color:#000;border:0;border-radius:10px;padding:12px;font-weight:800}.tip.custom{grid-column:span 4}.small{font-size:12px;color:#aaa;margin-top:10px}.admin{margin-top:30px;text-align:center}.admin a{color:#aaa;font-size:12px}.notice{border:1px solid #555;background:#111;border-radius:14px;padding:15px;margin-bottom:14px;text-align:center}.notice strong{display:block;font-size:18px;margin-bottom:4px}.paymethods{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.paymethod{background:#fff;color:#000;border:0;border-radius:12px;padding:16px 10px;font-size:16px;font-weight:800}.paycancel{width:100%;margin-top:10px;background:#222;color:#fff;border:1px solid #555;border-radius:12px;padding:13px;font-weight:800}@media(max-width:520px){.tips{grid-template-columns:repeat(2,1fr)}.tip.custom{grid-column:span 2}.title{font-size:18px}.artist{font-size:15px}.req{min-width:88px;padding:11px 10px}}
</style></head><body>
<div class="wrap">
<header class="hero"><img class="logo" src="logo.jpeg" alt="Phil Smith Live Requests"><div class="tagline">Request a song for today’s show</div><div id="status" class="status"><span class="dot"></span><span id="statusText">Checking request status…</span></div></header>
<div id="notice"></div>
<div class="controls"><input id="search" class="search" placeholder="Search song, artist/band, or decade…" autocomplete="off"><div id="filters" class="filters"></div></div>
<div id="count" class="count"></div><div id="list" class="list"></div><div id="empty" class="count" style="display:none;text-align:center">No songs found.</div>
</div>
<div id="modal" class="modal"><div class="sheet">
<div id="formView"><h2>Request this song</h2><div id="selected" class="selected"></div>
<label for="name">Your name (optional)</label><input id="name" placeholder="First name">
<label for="notes">Dedication or notes (optional)</label><textarea id="notes" placeholder="Dedication, special request, etc."></textarea>
<div class="actions"><button class="btn secondary" id="cancel">Cancel</button><button class="btn primary" id="send">Send Request</button></div></div>
<div id="success" class="success"><div style="font-size:42px">🎵</div><h2>Request sent!</h2><div id="successSong"></div><div id="historyMsg" class="notice" style="margin-top:14px"></div>
<div class="tipbox"><strong>❤️ Want to support the music?</strong><div class="small">Tips are optional. Your request is free.</div><div class="paymethods"><button id="tipVenmo" class="paymethod">Tip with Venmo</button><button id="tipCash" class="paymethod">Tip with Cash App</button></div><div class="small">Choose your tip amount in Venmo or Cash App.</div></div>
<div class="actions"><button class="btn primary" id="done">Done</button></div></div>
</div></div>
<div id="payModal" class="modal"><div class="sheet"><h2>Choose how to tip</h2><div id="payAmount" class="selected"></div><div class="paymethods"><button id="payVenmo" class="paymethod">Pay with Venmo</button><button id="payCash" class="paymethod">Pay with Cash App</button></div><button id="payCancel" class="paycancel">Cancel</button></div></div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbwCVYb78lADt8BH_FoNuqQYM-5RpWSB0UT2L2AQBE2NCU3nCzNQFMDl4RWwk542SCkr/exec";
const VENMO_USER="Phillip-Smith-77"; const CASHAPP_USER="$PhilSmithLive";
let songs=[],state={open:true,counts:{},played:{},requests:{},tips:{}} ,selected=null,filter="All",pendingTip=null;
async function api(action,payload={}){if(!API_URL||API_URL.includes("PASTE_"))return null;try{const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action,...payload})});return await r.json()}catch(e){return null}}
const SUPABASE_URL="https://sluffhedekxnoasndnid.supabase.co";
const SUPABASE_KEY="sb_publishable_frGKYqeqHpuww4Y78uvSVQ_SAMLLDk8";
const MUSICIAN_ID="adbce7b8-424e-4de3-84ed-7c4e68c64559";
async function loadSongs(){
  const url=SUPABASE_URL+"/rest/v1/songs?select=id,title,artist,decade&musician_id=eq."+encodeURIComponent(MUSICIAN_ID)+"&public_request_enabled=eq.true&is_active=eq.true&order=title.asc";
  const r=await fetch(url,{headers:{apikey:SUPABASE_KEY}});
  if(!r.ok)throw new Error("Could not load songs from Supabase ("+r.status+")");
  const rows=await r.json();
  return rows.map(x=>({id:x.id,song:x.title,artist:x.artist,decade:x.decade}));
}
async function submitSupabaseRequest(payload) {
  const response = await fetch(SUPABASE_URL + "/rest/v1/requests", {
    method: "POST",
    headers: {
      "apikey": SUPABASE_KEY,
      "Content-Type": "application/json",
      "Prefer": "return=minimal"
    },
    body: JSON.stringify({
      musician_id: MUSICIAN_ID,
      song_id: selected.id,
      requester_name: payload.name || null,
      notes: payload.notes || null,
      status: "pending"
    })
  });

  if (!response.ok) {
    throw new Error("Request failed: " + response.status);
  }

  return { ok: true };
}
  async function init(){
  try{songs=await loadSongs()}catch(e){console.error(e);document.getElementById("notice").innerHTML='<div class="notice"><strong>Song list unavailable</strong>Please try again shortly.</div>';songs=[]}
  renderFilters();await refresh();render();
}
async function refresh(){const r=await api("status");if(r){state=r;setStatus(r.open);return true}else{setStatus(state.open);return false}}
async function autoRefresh(){if(document.hidden)return;const ok=await refresh();if(ok)render()}
function setStatus(open){state.open=open;const el=document.getElementById("status"),t=document.getElementById("statusText"),n=document.getElementById("notice");el.classList.toggle("off",!open);t.textContent=open?"Song requests are OPEN":"Song requests are CLOSED";n.innerHTML=open?"":'<div class="notice"><strong>Song requests are closed</strong>Check back when the show starts.</div>'}
function renderFilters(){const f=document.getElementById("filters");["All","1950s","1960s","1970s","1980s","1990s","2000s","2010s","2020s"].forEach(x=>{const b=document.createElement("button");b.className="filter"+(x===filter?" active":"");b.textContent=x;b.onclick=()=>{filter=x;renderFilters();render()};f.appendChild(b)})}
function render(){const q=document.getElementById("search").value.toLowerCase().trim();const arr=songs.filter(x=>(filter==="All"||x.decade===filter)&&((x.song+" "+x.artist+" "+x.decade).toLowerCase().includes(q))).sort((a,b)=>a.song.localeCompare(b.song,undefined,{sensitivity:"base"})||a.artist.localeCompare(b.artist,undefined,{sensitivity:"base"}));document.getElementById("count").textContent=arr.length+" songs";document.getElementById("empty").style.display=arr.length?"none":"block";const list=document.getElementById("list");list.innerHTML="";arr.forEach(x=>{const k=key(x),c=state.counts?.[k]||0,p=state.played?.[k]||false,r=state.requests?.[k]||false;const el=document.createElement("div");el.className="song";el.innerHTML=`<div class="info"><div class="title">${esc(x.song)}</div><div class="artist">${esc(x.artist)}</div><div class="decade">${esc(x.decade)}</div>${(c||p)?`<div class="badge">${c?c+" request"+(c===1?"":"s"):""}${p?(c?" • ":"")+"played":""}</div>`:""}</div><button class="req" ${!state.open||p?"disabled":""}>${p?"PLAYED":c?"REQUEST":"REQUEST"}</button>`;el.querySelector("button").onclick=()=>openRequest(x);list.appendChild(el)})}
function key(x){return (x.artist+"||"+x.song+"||"+x.decade).toLowerCase()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function openRequest(x){if(!state.open)return;selected=x;document.getElementById("name").value="";document.getElementById("notes").value="";document.getElementById("selected").textContent=x.song+" — "+x.artist+" ("+x.decade+")";document.getElementById("modal").classList.add("open");document.getElementById("formView").style.display="block";document.getElementById("success").style.display="none"}
document.getElementById("search").oninput=render;document.getElementById("cancel").onclick=()=>document.getElementById("modal").classList.remove("open");document.getElementById("done").onclick=()=>document.getElementById("modal").classList.remove("open");
document.getElementById("send").onclick=async()=>{if(!selected)return;const b=document.getElementById("send");b.disabled=true;b.textContent="Sending…";const payload={song:selected.song,artist:selected.artist,decade:selected.decade,name:document.getElementById("name").value.trim(),notes:document.getElementById("notes").value.trim()};const r=await submitSupabaseRequest(payload);if(r&&r.ok){state=r.state||state;document.getElementById("successSong").textContent=selected.song+" — "+selected.artist;document.getElementById("historyMsg").innerHTML=r.already?"This song was already requested/played tonight. Your request has also been recorded.":"You’re the first request for this song tonight.";document.getElementById("formView").style.display="none";document.getElementById("success").style.display="block";render()}else{alert(r?.message||"Please try again.")}b.disabled=false;b.textContent="Send Request"};
function tipChoices(amount){const note=encodeURIComponent("Phil Smith Live tip");const a=encodeURIComponent(amount||"");return {venmo:"https://venmo.com/u/"+encodeURIComponent(VENMO_USER)+"?txn=pay&amount="+a+"&note="+note,cash:"https://cash.app/$"+encodeURIComponent(CASHAPP_USER.replace(/^\$/,""))+"/"+a}}
function chooseTip(amount){pendingTip=String(amount);document.getElementById("payAmount").textContent="$"+pendingTip+" tip";document.getElementById("payModal").classList.add("open")}
function finishTip(method){if(!pendingTip)return;const amount=pendingTip;const links=tipChoices(amount);const url=method==="Venmo"?links.venmo:links.cash;window.location.href=url;document.getElementById("payModal").classList.remove("open");api("tip",{song:selected?.song||"",artist:selected?.artist||"",amount,method}).catch(()=>{});pendingTip=null}
document.getElementById("tipVenmo").onclick=()=>{window.location.href="https://venmo.com/u/"+encodeURIComponent(VENMO_USER)};document.getElementById("tipCash").onclick=()=>{window.location.href="https://cash.app/$"+encodeURIComponent(CASHAPP_USER.replace(/^\$/,""))};document.getElementById("payVenmo").onclick=()=>finishTip("Venmo");document.getElementById("payCash").onclick=()=>finishTip("Cash App");document.getElementById("payCancel").onclick=()=>{pendingTip=null;document.getElementById("payModal").classList.remove("open")};
init();setInterval(autoRefresh,8000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)autoRefresh()});
</script></body></html>
