<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audience phone preview</title><style>*{box-sizing:border-box}body{margin:0;background:#09160f;color:#edf8f1;font:16px/1.5 system-ui;text-align:center}main{max-width:680px;padding:18px;margin:auto}h1{font-size:25px;margin:10px}a{color:#a5efbc}nav{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}p{margin:12px 0}.phone{width:min(414px,100%);padding:10px;border:2px solid #777;border-radius:44px;background:#171917;margin:18px auto;box-shadow:0 12px 35px #0008}.speaker{width:80px;height:6px;background:#777;border-radius:10px;margin:0 auto 9px}iframe{display:block;border:0;border-radius:29px;width:100%;height:min(740px,70dvh);background:#080b09}.hint{font-size:14px;color:#bed2c4}</style></head><body><main><nav><a href="subscriber-signup-test.html">← Main menu</a><a id="full-page" hidden target="_blank" rel="noopener">Open full audience page ↗</a></nav><h1>Audience phone preview</h1><p class="hint">This is your live audience page. Requests and volume votes submitted here are real. Your QR code opens the full page fitted to each audience member’s device.</p><p id="error" role="status"></p><div class="phone" id="phone" hidden><div class="speaker" aria-hidden="true"></div><iframe id="audience" title="Live audience page in a phone-sized preview" referrerpolicy="same-origin"></iframe></div></main><script>'use strict';const slug=new URLSearchParams(location.search).get('musician');if(!slug||!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug)||slug.length>60){document.getElementById('error').textContent='Open this preview from your main menu.'}else{const url=new URL('subscriber-customer-test.html',location.href);url.searchParams.set('musician',slug);document.getElementById('audience').src=url.href;const a=document.getElementById('full-page');a.href=url.href;a.hidden=false;document.getElementById('phone').hidden=false}</script></body></html>
