<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audience phone preview</title><style>*{box-sizing:border-box}body{margin:0;background:#09160f;color:#edf8f1;font:16px/1.5 system-ui;text-align:center}main{max-width:680px;padding:18px;margin:auto}h1{font-size:25px;margin:10px}a{color:#a5efbc}nav{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}p{margin:12px 0}.phone{width:min(414px,100%);padding:10px;border:2px solid #777;border-radius:44px;background:#171917;margin:18px auto;box-shadow:0 12px 35px #0008}.speaker{width:80px;height:6px;background:#777;border-radius:10px;margin:0 auto 9px}iframe{display:block;border:0;border-radius:29px;width:100%;height:min(740px,70dvh);background:#080b09}.hint{font-size:14px;color:#bed2c4}</style><style>.setup-guide{padding:20px;margin:18px 0;border:1px solid #75aa83;border-radius:14px;background:#112b1c;color:#effaf2;text-align:left;font:16px/1.6 system-ui}.setup-guide h2{font:700 23px system-ui;margin:10px 0}.setup-guide p{color:#d0e5d6}.setup-guide nav{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;justify-content:flex-start}.setup-guide a,.setup-guide button{display:inline-block;width:auto;min-height:46px;padding:10px 16px;border:1px solid #83bb90;border-radius:9px;background:#245836;color:#effaf2;text-decoration:none;font:600 16px system-ui;margin:0}.setup-guide small{display:block}.setup-guide ol{padding-left:24px}.setup-guide [aria-current=step]{font-weight:750;color:#8eefa7}body.guided-setup>.owner-navigation{display:none}body.guided-setup main>.owner-navigation,body.guided-setup main>.musician-tools,body.guided-setup main>.device-copy-panel{display:none}</style></head><body><main><nav><a href="subscriber-signup-test.html">← Main menu</a><a id="full-page" hidden target="_blank" rel="noopener">Open full audience page ↗</a></nav><h1>Audience phone preview</h1><p class="hint">This is your live audience page. Requests and volume votes submitted here are real. Your QR code opens the full page fitted to each audience member’s device.</p><p id="error" role="status"></p><div class="phone" id="phone" hidden><div class="speaker" aria-hidden="true"></div><iframe id="audience" title="Live audience page in a phone-sized preview" referrerpolicy="same-origin"></iframe></div></main><script>
window.SetupFlow=(()=>{
const active=new URLSearchParams(location.search).has('setup');
const path=location.pathname.split('/').pop();
const custom='subscriber-customization-test.html?setup=1',library='subscriber-library-test.html?setup=1',finish='subscriber-signup-test.html?setup=finish';
function mount(account){
 if(!active||!account||document.getElementById('setup-guide'))return;
 document.body.classList.add('guided-setup');
 const section=document.createElement('section');section.id='setup-guide';section.className='setup-guide';
 const preview='subscriber-audience-preview.html?setup=1&musician='+encodeURIComponent(account.slug);
 let step=1,title='Customize your page',body='<p>Make this page yours. Add a photo or logo, choose your appearance and write a welcome message. Social and tip links are optional. The preview updates as you work.</p><p>You can change these choices later. Save &amp; continue moves to your songs.</p>',buttons='';
 const link=(href,label)=>'<a href="'+href+'">'+label+'</a>';
 if(path.includes('customization')){
  buttons='<button type="submit" form="settings-form" data-setup-next="subscriber-signup-test.html">Back · save changes</button><button type="submit" form="settings-form" data-setup-next="'+library+'">Save &amp; continue</button>'+link(library,'Skip for now');
 }else if(path.includes('library')||path.includes('song-import')){
  step=2;title='Add your songs';body='<p>Import your library or add songs individually. Your lyrics and chord charts stay private. Choose which songs are Ready to play and allow audience requests for the ones you want fans to see.</p><details><summary>How to export from BandHelper</summary><ol><li>Open the BandHelper website and choose <strong>Admin → Export</strong>.</li><li>Select your project and uncheck <strong>Include Finance Data</strong>.</li><li>Choose <strong>Continue</strong>, then download the JSON file.</li><li>Return here and choose that file in the BandHelper importer.</li></ol><p>Attached PDFs and recordings are not included in that JSON file.</p></details><p>Duplicates and missing information can be reviewed later. Alternate arrangements can stay separate; you do not have to clean up your library before importing.</p>';
  buttons=link(custom,'Back: Customize')+link(path.includes('song-import')?library:'subscriber-song-import-test.html?setup=1',path.includes('song-import')?'View saved songs':'Import songs')+link(preview,'Continue: Preview audience page');
  body+='<p>Finish saving your song edits or importing before continuing. You can also continue with no songs and add them later.</p>';
 }else if(path.includes('audience-preview')){
  step=3;title='Preview your audience page';body='<p>This is what fans will see on a phone. Check your branding and the songs you allow audiences to request. Learning songs and private charts are not shown to fans.</p><p>Requests and volume votes in this preview are real. Requests stay closed until you start a show.</p>';
  buttons=link(library,'Back: Songs')+link(custom,'Edit appearance')+link(finish,'Continue: Get ready to perform');
 }else{
  step=4;title='Get ready to perform';body='<p><strong>For the best experience, connect to Wi-Fi, cellular data or your phone’s personal hotspot.</strong></p><ol><li>Open Performance and select a song. Most of your time will be spent in <strong>Playing</strong> or <strong>Between Songs</strong>. Tap a ? for help.</li><li>Wait for <strong>Your songs are ready offline on this device</strong> below. Each device or Home Screen app needs its own preparation.</li><li>On your gig device, test closing and reopening the app without Wi-Fi or cellular service. Reading and scrolling saved charts work offline; requests, volume feedback and show controls need internet.</li></ol><details><summary>Add the app to your Home Screen</summary><p>Open your Main menu in Safari. Tap <strong>Share → Add to Home Screen</strong> (View More if needed), then Add. Open the new icon, sign in if asked, and check offline readiness there too.</p><p>On Android Chrome, choose the three-dot menu → Add to Home screen or Install.</p></details><p>Try a rehearsal before relying on the app at a gig. Your Main menu contains your audience link and printable QR code.</p>';
  buttons=link(preview,'Back: Audience preview')+link('subscriber-performance-test.html','Open Performance')+link('subscriber-signup-test.html','Finish setup · Main menu');
 }
 section.innerHTML='<small>Step '+step+' of 4 · Customize → Songs → Audience preview → Perform</small><h2>'+title+'</h2>'+body+'<nav aria-label="Setup navigation">'+buttons+'</nav>';
 const parent=path.includes('signup')?document.getElementById('workspace'):document.querySelector('main');parent.prepend(section);
 if(path.includes('customization'))document.getElementById('save').textContent='Save customization';
}
return{active,mount};})();
</script><script>'use strict';const slug=new URLSearchParams(location.search).get('musician');if(!slug||!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug)||slug.length>60){document.getElementById('error').textContent='Open this preview from your main menu.'}else{SetupFlow.mount({slug});const url=new URL('subscriber-customer-test.html',location.href);url.searchParams.set('musician',slug);document.getElementById('audience').src=url.href;const a=document.getElementById('full-page');a.href=url.href;a.hidden=false;document.getElementById('phone').hidden=false}</script></body></html>
