  const el=document.createElement('div');el.className='item library-item';const text=document.createElement('div');text.style.minWidth='0';text.style.flex='1';const top=document.createElement('div');top.className='songtitle';top.textContent=x.title||'Untitled';top.title=(x.title||'Untitled')+(x.artist?' — '+x.artist:'');const meta=document.createElement('div');meta.className='artist';meta.textContent=(x.artist||'')+' · '+status(x);text.append(top,meta);
  const b=document.createElement('button');b.className='smallbtn';const already=ids.has(String(x.id));b.textContent=already?'Added ✓':'+ Add';b.disabled=!s||already;b.onclick=()=>addLibrarySong(x.id);const drag=document.createElement('button');drag.className='library-drag';drag.type='button';drag.textContent='☰';drag.title='Hold and drag into setlist';drag.setAttribute('aria-label','Drag '+(x.title||'song')+' into setlist');drag.disabled=!s||already;drag.onpointerdown=e=>beginLibraryDrag(e,x,drag);el.append(drag,text,b);attachLibraryRowDrag(el, x, b);frag.append(el)
 }
 root.append(frag);
 const alphabet='#ABCDEFGHIJKLMNOPQRSTUVWXYZ';for(const letter of alphabet){const b=document.createElement('button');b.type='button';b.textContent=letter;b.disabled=!headings.has(letter);b.setAttribute('aria-label','Jump to '+letter);b.onclick=()=>{const h=headings.get(letter);if(h)root.scrollTop=h.offsetTop-root.offsetTop};az.append(b)}
}

function addLibrarySong(id,at){const s=active(),str=String(id);if(!s||s.songIds.includes(str))return false;const pos=Number.isInteger(at)?Math.max(0,Math.min(s.songIds.length,at)):s.songIds.length;s.songIds.splice(pos,0,str);save();render();return true}
function libraryDropIndex(y){const root=$('set-songs'),rows=[...root.querySelectorAll('.set-row')];for(let i=0;i<rows.length;i++){const rect=rows[i].getBoundingClientRect();if(y<rect.top+rect.height/2)return i}return rows.length}
function clearLibraryDragUI(){const root=$('set-songs');root.classList.remove('library-drag-over');root.querySelector('.set-drop-marker')?.remove();$('drag-ghost').hidden=true}
function updateLibraryDrag(e){if(!libraryDragging||e.pointerId!==libraryDragging.pointerId)return;const g=$('drag-ghost');g.style.left=e.clientX+'px';g.style.top=e.clientY+'px';const area=$('set-songs').getBoundingClientRect();const inside=e.clientX>=area.left&&e.clientX<=area.right&&e.clientY>=area.top&&e.clientY<=area.bottom;libraryDragging.inside=inside;clearLibraryDragUI();g.hidden=false;if(!inside)return;const root=$('set-songs');root.classList.add('library-drag-over');if(e.clientY<area.top+35)root.scrollTop-=14;else if(e.clientY>area.bottom-35)root.scrollTop+=14;const idx=libraryDropIndex(e.clientY);libraryDragging.at=idx;const mark=document.createElement('div');mark.className='set-drop-marker';const rows=root.querySelectorAll('.set-row');if(rows[idx])root.insertBefore(mark,rows[idx]);else root.append(mark)}
function beginLibraryDrag(e,song,handle){if(e.pointerType==='mouse'&&e.button!==0)return;if(!active()||active().songIds.includes(String(song.id)))return;e.preventDefault();libraryDragging={pointerId:e.pointerId,id:song.id,inside:false,at:0};handle.setPointerCapture(e.pointerId);const g=$('drag-ghost');g.textContent=song.title||'Untitled';g.hidden=false;updateLibraryDrag(e)}
document.addEventListener('pointermove',e=>{if(!libraryDragging||e.pointerId!==libraryDragging.pointerId)return;e.preventDefault();updateLibraryDrag(e)},{passive:false});
document.addEventListener('pointerup',e=>{if(!libraryDragging||e.pointerId!==libraryDragging.pointerId)return;const {id,inside,at}=libraryDragging;libraryDragging=null;clearLibraryDragUI();if(inside)addLibrarySong(id,at)});
document.addEventListener('pointercancel',()=>{libraryDragging=null;clearLibraryDragUI()});


// A short hold starts a drag, so quick swipes can continue scrolling on iPad.
// Existing pointermove/pointerup routines perform actual row reordering.
function attachWholeRowDrag(row,index,deleteButton){
 let timer=null, origin=null;
 row.addEventListener('pointerdown',e=>{
  if(e.target.closest('button,input,select')||e.button!==0)return;
  origin={x:e.clientX,y:e.clientY,pointerId:e.pointerId};
  timer=setTimeout(()=>{timer=null;if(origin){beginDrag({button:0,preventDefault(){},pointerId:origin.pointerId,currentTarget:row},row,index)}},260);
 });
 row.addEventListener('pointermove',e=>{if(timer&&origin&&Math.hypot(e.clientX-origin.x,e.clientY-origin.y)>9){clearTimeout(timer);timer=null}});
 const cancel=()=>{clearTimeout(timer);timer=null;origin=null};
 row.addEventListener('pointerup',cancel);row.addEventListener('pointercancel',cancel);
}
function attachLibraryRowDrag(row,song,addButton){
 let timer=null,origin=null;
 row.addEventListener('pointerdown',e=>{
  if(e.target.closest('button,input,select')||e.button!==0)return;
  origin={x:e.clientX,y:e.clientY,pointerId:e.pointerId};
  timer=setTimeout(()=>{timer=null;if(origin)beginLibraryDrag({pointerType:'touch',preventDefault(){},pointerId:origin.pointerId},song,row)},260);
 });
 row.addEventListener('pointermove',e=>{if(timer&&origin&&Math.hypot(e.clientX-origin.x,e.clientY-origin.y)>9){clearTimeout(timer);timer=null}});
 const cancel=()=>{clearTimeout(timer);timer=null;origin=null};
 row.addEventListener('pointerup',cancel);row.addEventListener('pointercancel',cancel);
}

$('setlist-picker').onchange=e=>pick(e.target.value||null);
$('new-setlist').onclick=()=>{$('manage-details').open=true;$('new-name').focus()};
$('play-setlist').onclick=()=>{const s=active();if(!s||!s.songIds.length)return;location.href='performance-setlist-development.html?setlist='+encodeURIComponent(s.id)};
const FONT_KEY='setlist-app-font-v1';function setAppFont(value){document.body.dataset.font=['hand','modern','classic'].includes(value)?value:'hand';$('font-choice').value=document.body.dataset.font;localStorage.setItem(FONT_KEY,document.body.dataset.font)}
setAppFont(localStorage.getItem(FONT_KEY)||'hand');$('font-choice').onchange=e=>setAppFont(e.target.value);
$('create').onclick=()=>{if(!musicianId){msg('Load your songbook first.');return}const name=$('new-name').value.trim();if(!name){msg('Enter a setlist name first.');return}const s={id:makeId(),name,songIds:[]};sets.push(s);$('new-name').value='';save();pick(s.id)};
$('new-name').addEventListener('keydown',e=>{if(e.key==='Enter')$('create').click()});
$('rename').onclick=()=>{const s=active();if(!s)return;const n=prompt('Rename setlist:',s.name);if(n===null)return;if(!n.trim())return msg('Setlist name cannot be empty.');s.name=n.trim().slice(0,100);save();render()};
$('duplicate').onclick=()=>{const s=active();if(!s)return;const clone={id:makeId(),name:s.name+' (Copy)',songIds:[...s.songIds]};sets.push(clone);save();pick(clone.id)};
$('remove-setlist').onclick=()=>{const s=active();if(!s||!confirm('Delete setlist "'+s.name+'"? Your songs will not be deleted.'))return;sets=sets.filter(x=>x.id!==s.id);selectedId=sets[0]?.id||null;save();render()};
$('export').onclick=()=>{if(!musicianId)return msg('Load your library first.');const text=JSON.stringify({type:'musician-setlists-backup',version:1,exportedAt:new Date().toISOString(),setlists:sets.map(s=>({...s}))},null,2);const blob=new Blob([text],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='setlists-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)};
$('song-search').oninput=()=>{drawLibrary();$('library-songs').scrollTop=0};$('song-filter').onchange=()=>{drawLibrary();$('library-songs').scrollTop=0};$('reload').onclick=()=>init(true);
async function init(force=false){msg('Loading song library…');let cache=null;try{cache=await readSavedSongs()}catch(e){console.warn('No offline library:',e)}if(cache?.songs?.length){userId=cache.userId;musicianId=cache.musicianId;songs=cache.songs;loadSets();selectedId=sets[0]?.id||null;render();msg('Loaded '+songs.length+' saved songs · Setlists save locally on this device.')}if(!navigator.onLine){if(!songs.length)msg('Offline library not found. Open Performance Beta while online and save your song library.');return}try{if(!window.supabase?.createClient){if(!songs.length)msg('Cannot connect to Supabase right now; try reloading online.');return}dbClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const {data:auth,error:authError}=await dbClient.auth.getSession();if(authError)throw authError;const user=auth?.session?.user;if(!user){if(!songs.length)msg('Please sign in through Musician Login, then reopen Setlist Manager.');return}const {data:m,error:err}=await dbClient.from('musicians').select('id').eq('user_id',user.id).maybeSingle();if(err||!m)throw err||new Error('Musician account not found');if(musicianId&&musicianId!==m.id){sets=[];selectedId=null}const loaded=[];for(let offset=0;offset<20000;offset+=500){const {data,error}=await dbClient.from('songs').select('id,title,artist,song_status').eq('musician_id',m.id).order('title').order('id').range(offset,offset+499);if(error)throw error;loaded.push(...(data||[]));if(!data||data.length<500)break}if(loaded.length){songs=loaded;musicianId=m.id;userId=user.id;loadSets();selectedId=sets.find(s=>s.id===selectedId)?.id||sets[0]?.id||null;render();msg('Synced '+songs.length+' songs online · Setlists save locally (not yet in Supabase).')}}catch(e){msg((songs.length?'Using saved song library. ':'')+'Online sync unavailable: '+(e.message||e))}}
if('serviceWorker' in navigator){navigator.serviceWorker.register('./performance-offline-sw.js').catch(e=>console.warn('Offline page cache unavailable',e));}
init();
</script></body></html>
